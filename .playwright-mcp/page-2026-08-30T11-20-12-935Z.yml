        - generic [ref=e107]: Uninstaller
        - heading "Delete apps without the crumbs" [level=3] [ref=e108]
        - paragraph [ref=e109]: Drop any app on Brewer and it finds the caches, preferences, containers and logs left behind - then trashes it all together. Casks go through brew, leftovers included.
        - list [ref=e110]:
          - listitem [ref=e111]: Everything goes to the Trash, so nothing is lost forever
          - listitem [ref=e112]: SmartDelete watches the Trash and offers cleanup automatically
          - listitem [ref=e113]: System and Apple apps are protected - always
