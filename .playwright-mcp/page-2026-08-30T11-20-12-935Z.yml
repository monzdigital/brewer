        - generic [ref=e96]: Beyond Homebrew
        - heading "Every app on your Mac, one inventory" [level=3] [ref=e97]
        - paragraph [ref=e98]: Brewer scans everything - casks, App Store buys, Sparkle self-updaters, and apps you dragged in years ago - with size, source, and architecture.
        - list [ref=e99]:
          - listitem [ref=e100]: "Update Sparkle apps directly: download, back up the old version, install"
          - listitem [ref=e101]: Read the release notes before you say yes
          - listitem [ref=e102]: Roll back from automatic backups if a new version misbehaves
          - listitem [ref=e103]: Adopt manually-installed apps so brew manages them from now on
