      - generic [ref=e68]: Why Brewer
      - heading "Everything brew does, one click away" [level=2] [ref=e69]
      - paragraph [ref=e70]: No mystery. Each button runs the exact brew command you would have typed - and shows you its output while it runs.
    - generic [ref=e71]:
      - generic [ref=e72]:
        - generic [ref=e73]: Updates
        - heading "See what's outdated. Upgrade it your way." [level=3] [ref=e74]
        - paragraph [ref=e75]: 133 packages behind? Upgrade everything, cherry-pick one, or snooze the noisy ones for a week.
        - list [ref=e76]:
          - listitem [ref=e77]: Scheduled checks with notifications - every 6h, daily, or weekly
          - listitem [ref=e78]: Automatic background upgrades that wait for AC power
          - listitem [ref=e79]: Running apps are closed cleanly before their upgrade
          - listitem [ref=e80]: The menu bar icon shows the outdated count at a glance
      - img "Updates screen with 133 available updates and per-package upgrade buttons" [ref=e82]
