        - generic [ref=e85]: Live console
        - heading "Watch Homebrew do its thing" [level=3] [ref=e86]
        - paragraph [ref=e87]: A Cakebrew-style console docks at the bottom of the window. Install something and the real output streams in - colors, warnings, exit codes, a Stop button.
        - list [ref=e88]:
          - listitem [ref=e89]: Every operation is queued, logged, and kept in History
          - listitem [ref=e90]:
            - text: Readable
            - code [ref=e91]: brew doctor
            - text: ", cleanup previews with sizes"
          - listitem [ref=e92]: Failures show the real error - not a shrug
